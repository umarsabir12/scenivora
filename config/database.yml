default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: scenivora_development
  cache:
    <<: *default
    database: scenivora_development_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: scenivora_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: scenivora_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: scenivora_test

production:
  primary: &primary_production
    <<: *default
    database: scenivora_production
    username: scenivora
    password: <%= ENV["SCENIVORA_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: scenivora_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: scenivora_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: scenivora_production_cable
    migrations_paths: db/cable_migrate
